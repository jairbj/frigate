name: Publish test image

# Home-test image for this branch. The upstream CI workflow only publishes
# images for pushes to dev and master, so a feature branch never gets a
# pullable tag. This job builds the standard amd64 image only.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/export-stream-choice-6e74
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-test-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amd64:
    name: AMD64 image
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Image tags
        id: names
        shell: bash
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short="${GITHUB_SHA::7}"
          echo "stable=ghcr.io/${repo}:export-stream" >> "$GITHUB_OUTPUT"
          echo "sha=ghcr.io/${repo}:${short}-amd64" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU and Buildx
        id: setup
        uses: ./.github/actions/setup
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/main/Dockerfile
          push: true
          platforms: linux/amd64
          target: frigate
          tags: |
            ${{ steps.names.outputs.stable }}
            ${{ steps.names.outputs.sha }}
          cache-from: type=registry,ref=${{ steps.setup.outputs.cache-name }}-amd64
          cache-to: type=registry,ref=${{ steps.setup.outputs.cache-name }}-amd64,mode=max
      - name: Allow pulls without a token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/frigate/visibility \
            -f visibility=public
          echo "Image ${{ steps.names.outputs.stable }}"
          echo "Image ${{ steps.names.outputs.sha }}"
